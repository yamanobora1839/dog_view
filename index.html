<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="スマートフォンのカメラで、人間と犬の見え方を体験するアプリです。">
  <title>犬と人間の見え方体験</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="viewer" aria-label="カメラ体験">
    <video id="camera-feed" autoplay muted playsinline aria-label="背面カメラの映像"></video>
    <canvas id="dog-view" aria-label="犬の色覚を近似したカメラ映像" hidden></canvas>

    <section class="start-panel" id="start-panel" aria-labelledby="page-title">
      <h1 id="page-title">犬と人間の見え方体験</h1>
      <p>カメラに映る景色を、肉眼で見た景色と見比べてみましょう。</p>
      <button class="button button--start" id="start-button" type="button">カメラを開始</button>
      <p class="notice" id="notice" role="status" aria-live="polite">カメラ映像はこの端末内だけで処理され、外部には送信されません。</p>
    </section>

    <section class="controls" id="controls" aria-label="見え方の切り替え" hidden>
      <div class="mode-buttons" role="group" aria-label="見え方を選択">
        <button class="button mode-button is-active" id="human-mode" type="button" aria-pressed="true">人間の見え方</button>
        <button class="button mode-button" id="dog-mode" type="button" aria-pressed="false">犬の見え方</button>
      </div>
      <p class="mode-status" id="mode-status" role="status" aria-live="polite">人間の見え方を表示しています</p>
      <button class="button button--stop" id="stop-button" type="button">カメラを停止</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
