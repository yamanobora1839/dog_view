<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>犬と人間の見え方体験</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="viewer" aria-label="カメラ映像 VR ビューアー">
    <section class="eye eye--left" aria-label="左目用の映像">
      <video class="camera-feed" autoplay muted playsinline></video>
    </section>
    <section class="eye eye--right" aria-label="右目用の映像">
      <video class="camera-feed" autoplay muted playsinline></video>
    </section>
    <div class="divider" aria-hidden="true"></div>

    <div class="start-panel" id="start-panel">
      <h1>犬と人間の見え方体験</h1>
      <p>スマートフォンを横向きにして、カメラを開始してください。</p>
      <button id="start-button" type="button">カメラを開始</button>
      <p class="notice" id="notice" role="status" aria-live="polite">カメラ映像はこの端末内だけで処理され、送信されません。</p>
    </div>

    <p class="orientation-hint" aria-live="polite">スマートフォンを横向きにしてください</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
